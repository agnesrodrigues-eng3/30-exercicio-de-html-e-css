<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos HTML</title>
</head>

<body>

    <h1>Trabalhando com atributos HTML</h1>

    <p>
        Nesta página serão apresentados alguns atributos HTML
        e suas respectivas funções.
    </p>

    <!--
        O atributo href define o endereço para onde
        o usuário será direcionado ao clicar no link.
    -->
    <a href="https://www.sinhadoces.com.br/comprar-bolo-online/bolos-chocolate-anivers?gad_source=1&gad_campaignid=392682296&gbraid=0AAAAADqIDDBEWq8r4qBYcWJ3nI_hp9C67&gclid=Cj0KCQjwnbrUBhDOARIsAKKhPpfhE6gfRUwSCiXuHehumO4o_nCjmbXFxrSJIfJ1mE887p5HmVTpvBMaArZ2EALw_wcB">
        Acesse o site de bolos
    </a>

    <br><br>

    <!--
        O atributo src define o caminho da imagem
        que será exibida na página.
        
        O atributo alt fornece uma descrição da imagem,
        sendo importante caso a imagem não seja carregada
        e também para acessibilidade.
        
        O atributo title apresenta uma informação adicional
        quando o usuário passa o mouse sobre a imagem.
        
        O atributo width define a largura da imagem.
        
        O atributo height define a altura da imagem.
    -->
    <img
        src="../img/boloniver.jpg"
        alt="Imagem de um bolo de aniversário"
        title="Bolo de aniversário"
        width="300"
        height="300"
     
</body>

</html>

</body>
</html>
