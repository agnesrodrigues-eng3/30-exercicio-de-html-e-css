<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<body>

    <h1>Exemplo de JavaScript</h1>

    <p id="texto">Texto original</p>

    <button onclick="trocarTexto()">Clique aqui</button>

    <button onclick="trocarTexto2()">Segundo botão</button>

    <script>

        // Esta função troca o texto do parágrafo
        function trocarTexto() {
            document.getElementById("texto").innerHTML = "Primeiro texto novo";
        }

        // Esta função troca o texto novamente
        function trocarTexto2() {
            document.getElementById("texto").innerHTML = "Segundo texto novo";
        }

    </script>

</body>

</html>
