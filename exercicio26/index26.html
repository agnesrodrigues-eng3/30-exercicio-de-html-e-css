<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Cores</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #101010;
            color: white;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .bloco {
            width: 220px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .nome {
            background-color: blue;
        }

        .hex {
            background-color: #FF5733;
        }

        .hex2 {
            background-color: #8A2BE2;
        }

        .rgb {
            background-color: rgb(0, 200, 100);
        }

        .rgb2 {
            background-color: rgb(255, 165, 0);
        }

        .rgba {
            background-color: rgba(255, 0, 0, 0.7);
        }

        .rgba2 {
            background-color: rgba(0, 150, 255, 0.6);
        }

        .hsl {
            background-color: hsl(280, 70%, 50%);
        }
    </style>
</head>

<body>

    <h1>Laboratório de Cores</h1>

    <p>
        Esta página apresenta diferentes maneiras de definir cores utilizando HTML e CSS.
    </p>

    <div class="container">

        <div class="bloco nome">
            Nome: blue
        </div>

        <div class="bloco hex">
            Hexadecimal: #FF5733
        </div>

        <div class="bloco hex2">
            Hexadecimal: #8A2BE2
        </div>

        <div class="bloco rgb">
            RGB: rgb(0, 200, 100)
        </div>

        <div class="bloco rgb2">
            RGB: rgb(255, 165, 0)
        </div>

        <div class="bloco rgba">
            RGBA: rgba(255, 0, 0, 0.7)
        </div>

        <div class="bloco rgba2">
            RGBA: rgba(0, 150, 255, 0.6)
        </div>

        <div class="bloco hsl">
            HSL: hsl(280, 70%, 50%)
        </div>

    </div>

</body>
</html>
